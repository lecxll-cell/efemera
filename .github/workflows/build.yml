name: Build do instalador Windows

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Instalar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm ci

      - name: Correr os testes
        run: npm test

      - name: Instalar o NSIS
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Construir o instalador
        run: npm run build:win

      - name: Guardar o instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: EFEMERA-Setup
          path: dist/EFEMERA-Setup-0.4.1.exe
          if-no-files-found: error

      - name: Publicar na Release (só em etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EFEMERA-Setup-0.4.1.exe

      - name: Analisar no VirusTotal (só em etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            dist/EFEMERA-Setup-0.4.1.exe

      - name: Acrescentar o link do VirusTotal às notas da release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $sha = (Get-FileHash "dist/EFEMERA-Setup-0.4.1.exe" -Algorithm SHA256).Hash.ToLower()
          $url = "https://www.virustotal.com/gui/file/$sha"
          $notes = gh release view $tag --json body -q .body
          if ($notes -match 'VirusTotal') { Write-Host "Link ja presente; nada a fazer."; exit 0 }
          $notes = $notes + "`n`n**Analise antivirus (VirusTotal):** $url"
          Set-Content -Path vt-notes.md -Value $notes -Encoding utf8
          gh release edit $tag --notes-file vt-notes.md
          Write-Host "Link do VirusTotal acrescentado as notas."
